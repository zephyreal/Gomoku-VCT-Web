name: Build and deploy Gomoku VCT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly engine
        run: |
          mkdir -p dist
          cp index.html vct-worker.js dist/
          emcc gomoku.cpp -O3 -std=c++17 -o dist/gomoku-engine.js \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=createGomokuModule \
            -s EXPORTED_FUNCTIONS='["_vct_init","_vct_play","_vct_undo","_vct_current_player","_vct_iswin","_vct_get_piece","_vct_search","_vct_best_x","_vct_best_y","_vct_last_score","_vct_last_nodes","_vct_last_tt_hits"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=67108864 \
            -s STACK_SIZE=1048576 \
            -s ENVIRONMENT='web,worker' \
            -s FILESYSTEM=0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
