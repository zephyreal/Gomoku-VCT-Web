<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f4f4">
<title>五子棋 VCT</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: #f4f4f4;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  color: #111;
  text-align: center;
}
.container {
  width: min(100%, 620px);
  margin: 0 auto;
  padding: 14px 12px 22px;
}
h1 { margin: 4px 0 8px; font-size: 28px; }
.status { margin: 6px 0 10px; font-size: 18px; font-weight: 700; }
.search-info {
  min-height: 22px;
  margin: 8px 0 2px;
  font-size: 14px;
  color: #555;
}
.board-wrap {
  width: 100%;
  padding: 10px;
  background: #dda95a;
  border-radius: 7px;
}
canvas {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #dda95a;
  touch-action: none;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  margin-top: 14px;
}
button, select {
  border: 0;
  border-radius: 8px;
  min-height: 44px;
  font-size: 16px;
}
button { padding: 0 18px; cursor: pointer; }
button:active { transform: scale(.98); }
button:disabled { opacity: .55; cursor: default; transform: none; }
#undo { background: #ddd; }
#vct { background: #1976d2; color: #fff; }
#stop { background: #a33; color: #fff; display: none; }
#restart { background: #333; color: #fff; }
.depth-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 14px;
  color: #555;
}
select { background: #fff; border: 1px solid #ccc; padding: 0 8px; }
.footer { margin-top: 10px; color: #666; font-size: 14px; }
.last-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e53935;
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
@media (max-width: 430px) {
  .container { padding-left: 8px; padding-right: 8px; }
  h1 { font-size: 24px; }
  .controls { gap: 7px; }
  button { padding: 0 14px; font-size: 15px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>五子棋 VCT</h1>
  <div class="status" id="status">当前：黑棋 ●</div>

  <div class="board-wrap">
    <canvas id="board" aria-label="15乘15五子棋棋盘"></canvas>
  </div>

  <div class="search-info" id="searchInfo">VCT 引擎准备就绪</div>

  <div class="controls">
    <button id="undo">悔棋</button>
    <button id="vct">VCT 搜索</button>
    <button id="stop">停止</button>
    <button id="restart">重新开始</button>
  </div>

  <div class="depth-row">
    <label for="depth">最大搜索深度</label>
    <select id="depth">
      <option value="12">12</option>
      <option value="14">14</option>
      <option value="16">16</option>
      <option value="18">18</option>
      <option value="20" selected>20</option>
    </select>
  </div>

  <div class="footer">15 × 15 Gomoku · C++ VCT · WebAssembly</div>
</div>

<script>
const SIZE = 15;
const SCORE_FIVE = 1000;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const searchInfoEl = document.getElementById('searchInfo');
const undoBtn = document.getElementById('undo');
const vctBtn = document.getElementById('vct');
const stopBtn = document.getElementById('stop');
const restartBtn = document.getElementById('restart');
const depthEl = document.getElementById('depth');

let board = [];
let history = [];
let player = 1;
let gameOver = false;
let searching = false;
let worker = null;

function newWorker() {
  if (worker) worker.terminate();
  worker = new Worker('./vct-worker.js');

  worker.onmessage = (event) => {
    const data = event.data || {};
    if (data.type === 'result') finishSearch(data);
    if (data.type === 'error') {
      setSearching(false);
      searchInfoEl.textContent = '搜索错误：' + data.message;
    }
  };

  worker.onerror = (event) => {
    setSearching(false);
    searchInfoEl.textContent = 'VCT 引擎加载失败，请刷新页面重试';
    console.error(event);
  };
}

function init() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  history = [];
  player = 1;
  gameOver = false;
  setSearching(false);
  newWorker();
  resize();
  updateStatus();
  searchInfoEl.textContent = 'VCT 引擎准备就绪';
}

function setSearching(value) {
  searching = value;
  vctBtn.disabled = value || gameOver;
  undoBtn.disabled = value;
  restartBtn.disabled = value;
  depthEl.disabled = value;
  stopBtn.style.display = value ? 'inline-block' : 'none';
  vctBtn.textContent = value ? '搜索中…' : 'VCT 搜索';
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.width * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function geometry() {
  const w = canvas.clientWidth;
  const margin = w * 0.055;
  const gap = (w - margin * 2) / (SIZE - 1);
  return { w, margin, gap };
}

function draw() {
  const { w, margin, gap } = geometry();
  ctx.clearRect(0, 0, w, w);
  ctx.fillStyle = '#dda95a';
  ctx.fillRect(0, 0, w, w);

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const p = margin + i * gap;
    ctx.beginPath(); ctx.moveTo(margin, p); ctx.lineTo(w - margin, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, margin); ctx.lineTo(p, w - margin); ctx.stroke();
  }

  ctx.fillStyle = '#222';
  [[3,3],[11,3],[7,7],[3,11],[11,11]].forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(margin + x * gap, margin + y * gap, Math.max(2.5, gap * .07), 0, Math.PI * 2);
    ctx.fill();
  });

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (board[y][x] !== 0) drawStone(x, y, board[y][x], margin, gap);
    }
  }

  if (history.length) {
    const last = history[history.length - 1];
    const cx = margin + last.x * gap;
    const cy = margin + last.y * gap;
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(2.2, gap * .08), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStone(x, y, color, margin, gap) {
  const cx = margin + x * gap;
  const cy = margin + y * gap;
  const r = gap * 0.43;
  const gradient = ctx.createRadialGradient(cx - r / 3, cy - r / 3, 2, cx, cy, r);

  if (color === 1) {
    gradient.addColorStop(0, '#666');
    gradient.addColorStop(1, '#000');
  } else {
    gradient.addColorStop(0, '#fff');
    gradient.addColorStop(1, '#ccc');
  }

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.stroke();
}

function placeMove(x, y, source = 'manual') {
  if (gameOver || board[y][x] !== 0) return false;

  const p = player;
  board[y][x] = p;
  history.push({ x, y, player: p });

  if (checkWin(x, y, p)) {
    gameOver = true;
    statusEl.textContent = p === 1 ? '黑棋获胜！' : '白棋获胜！';
    vctBtn.disabled = true;
    draw();
    return true;
  }

  player = p === 1 ? 2 : 1;
  updateStatus();
  draw();
  return true;
}

function handleInput(e) {
  if (gameOver || searching) return;
  const rect = canvas.getBoundingClientRect();
  const { margin, gap } = geometry();
  const x = Math.round((e.clientX - rect.left - margin) / gap);
  const y = Math.round((e.clientY - rect.top - margin) / gap);
  if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
  placeMove(x, y, 'manual');
}

function checkWin(x, y, p) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dx, dy] of dirs) {
    let count = 1;
    for (let s = 1; s < 5; s++) {
      const nx = x + dx * s, ny = y + dy * s;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && board[ny][nx] === p) count++;
      else break;
    }
    for (let s = 1; s < 5; s++) {
      const nx = x - dx * s, ny = y - dy * s;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && board[ny][nx] === p) count++;
      else break;
    }
    if (count >= 5) return true;
  }
  return false;
}

function updateStatus() {
  statusEl.textContent = player === 1 ? '当前：黑棋 ●' : '当前：白棋 ○';
}

function startSearch() {
  if (gameOver || searching) return;
  if (!worker) newWorker();

  setSearching(true);
  searchInfoEl.textContent = 'VCT 搜索中，请稍候…';

  worker.postMessage({
    type: 'search',
    depth: Number(depthEl.value),
    history: history.map(({ x, y }) => ({ x, y }))
  });
}

function finishSearch(data) {
  setSearching(false);

  const seconds = (data.elapsedMs / 1000).toFixed(2);
  const nodes = Math.round(data.nodes || 0).toLocaleString();
  const hits = Math.round(data.ttHits || 0).toLocaleString();

  if (data.score >= SCORE_FIVE && data.x >= 0 && data.y >= 0) {
    searchInfoEl.textContent = `发现必胜着法：(${data.x}, ${data.y}) · ${seconds}s · ${nodes} 节点 · TT ${hits}`;
    placeMove(data.x, data.y, 'ai');
  } else {
    searchInfoEl.textContent = `当前深度未发现必胜路径 · 得分 ${data.score} · ${seconds}s · ${nodes} 节点`;
  }
}

function stopSearch() {
  if (!searching) return;
  newWorker();
  setSearching(false);
  searchInfoEl.textContent = '搜索已停止';
}

canvas.addEventListener('pointerdown', handleInput);

undoBtn.onclick = () => {
  if (!history.length || searching) return;
  const move = history.pop();
  board[move.y][move.x] = 0;
  player = move.player;
  gameOver = false;
  vctBtn.disabled = false;
  updateStatus();
  searchInfoEl.textContent = '已悔棋';
  draw();
};

vctBtn.onclick = startSearch;
stopBtn.onclick = stopSearch;
restartBtn.onclick = init;
window.addEventListener('resize', resize);

init();
</script>
</body>
</html>
