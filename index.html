<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>五子棋 AI · Adaptive MCTS</title>

  <style>
    :root {
      --bg-0: #050b13;
      --bg-1: #07111f;
      --bg-2: #0b1b2f;
      --panel: rgba(14, 28, 48, .72);
      --panel-2: rgba(20, 39, 65, .62);
      --line: rgba(133, 190, 255, .18);
      --line-strong: rgba(133, 190, 255, .34);
      --text: #f4f8ff;
      --muted: #8fa4bc;
      --cyan: #58d6ff;
      --blue: #3399ff;
      --green: #56e6c1;
      --danger: #ff7a8c;
      --shadow: 0 18px 50px rgba(0,0,0,.34);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
        "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 80% -10%, rgba(54,157,255,.24), transparent 30%),
        radial-gradient(circle at 15% 25%, rgba(56,210,255,.08), transparent 26%),
        linear-gradient(180deg, var(--bg-2), var(--bg-0) 62%, #03070c 100%);
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black 0%, transparent 70%);
    }

    .app {
      width: min(100%, 760px);
      padding: 10px 9px 14px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .brand-wrap { min-width: 0; }

    .brand {
      margin: 0;
      letter-spacing: .04em;
      font-size: clamp(22px, 4.5vw, 30px);
      font-weight: 780;
      line-height: 1.1;
    }

    .brand span {
      background: linear-gradient(90deg, #f7fbff, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .08em;
    }

    .engine-dot {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #cfe8ff;
      background: rgba(11,25,43,.74);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 20px rgba(75,166,255,.05);
    }

    .engine-dot i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: block;
      background: var(--green);
      box-shadow: 0 0 12px rgba(86,230,193,.8);
    }

    .hero {
      display: none;
    }

    .board-shell {
      padding: 5px;
      border-radius: 18px;
      background:
        linear-gradient(180deg,
          rgba(40,67,94,.38),
          rgba(12,25,41,.48));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .board-inner {
      padding: 4px;
      border-radius: 14px;
      background:
        linear-gradient(135deg,
          #e1b46d,
          #c48b47 52%,
          #d39d57);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.28),
        inset 0 0 32px rgba(85,42,10,.10);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      touch-action: none;
      user-select: none;
    }

    .metrics {
      margin: 0 0 7px;
      display: grid;
      grid-template-columns: 1.25fr 1fr .85fr 1fr;
      gap: 5px;
    }

    .metric {
      min-width: 0;
      padding: 7px 7px 6px;
      border-radius: 11px;
      background: rgba(15, 31, 52, .68);
      border: 1px solid rgba(133,190,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }

    .metric-label {
      color: var(--muted);
      font-size: 8px;
      line-height: 1.1;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.15;
      font-weight: 730;
      color: #f5f9ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-sub {
      margin-top: 1px;
      color: #6f86a0;
      font-size: 7px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-line {
      margin-top: 6px;
      min-height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 690;
      color: #dfeeff;
      background: rgba(8,19,33,.68);
      border: 1px solid rgba(130,181,232,.13);
    }

    .status-line.loading { color: #91cfff; }
    .status-line.ai { color: #7edcff; }
    .status-line.win { color: #ffd27d; }
    .status-line.error { color: #ff96a6; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 6px;
      margin-top: 7px;
    }

    button {
      min-height: 40px;
      border: 1px solid rgba(134,181,228,.20);
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      color: #dcecff;
      cursor: pointer;
      background:
        linear-gradient(180deg,
          rgba(21,39,62,.88),
          rgba(10,23,39,.88));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 10px 26px rgba(0,0,0,.14);
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }

    button:active:not(:disabled) {
      transform: translateY(1px) scale(.995);
    }

    button:disabled {
      opacity: .42;
      cursor: default;
    }

    #reloadBtn {
      color: #eaf9ff;
      border-color: rgba(76,190,255,.56);
      background:
        linear-gradient(180deg,
          rgba(18,92,148,.82),
          rgba(10,53,93,.90));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 0 24px rgba(49,164,255,.14);
    }

    .difficulty-select {
      width: 100%;
      margin-top: 1px;
      padding: 0;
      border: 0;
      outline: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: #f5f9ff;
      font: inherit;
      font-size: 12px;
      font-weight: 730;
      cursor: pointer;
    }

    .difficulty-select option {
      color: #111;
      background: #fff;
    }

    .difficulty-wrap {
      position: relative;
    }

    .difficulty-wrap::after {
      content: "⌄";
      position: absolute;
      right: 0;
      top: 3px;
      color: #58d6ff;
      font-size: 15px;
      pointer-events: none;
    }

    .footnote {
      margin-top: 6px;
      text-align: center;
      color: #526981;
      font-size: 8px;
      line-height: 1.35;
      letter-spacing: .04em;
    }

    @media (max-width: 560px) {
      .app {
        padding: 7px 6px 9px;
      }

      .topbar {
        margin-bottom: 5px;
      }

      .brand {
        font-size: 21px;
      }

      .brand-sub {
        display: none;
      }

      .engine-dot {
        padding: 5px 7px;
        font-size: 8px;
      }

      .metrics {
        grid-template-columns: 1.25fr 1fr .85fr 1fr;
        gap: 4px;
        margin-bottom: 5px;
      }

      .metric {
        padding: 5px 5px 4px;
        border-radius: 9px;
      }

      .metric-label {
        font-size: 7px;
      }

      .metric-value,
      .difficulty-select {
        font-size: 11px;
      }

      .metric-sub {
        font-size: 6px;
      }

      .difficulty-wrap::after {
        font-size: 11px;
        top: 0;
      }

      .board-shell {
        padding: 4px;
        border-radius: 15px;
      }

      .board-inner {
        padding: 3px;
        border-radius: 12px;
      }

      .status-line {
        margin-top: 5px;
        min-height: 29px;
        font-size: 11px;
        padding: 4px 8px;
      }

      .actions {
        gap: 5px;
        margin-top: 5px;
      }

      button {
        min-height: 37px;
        font-size: 11px;
        padding: 0 5px;
      }

      .footnote {
        margin-top: 5px;
        font-size: 7px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand-wrap">
      <h1 class="brand">五子棋 <span>AI</span></h1>
      <div class="brand-sub">标准对局 · 15×15</div>
    </div>

    <div class="engine-dot">
      <i></i>
      ONLINE
    </div>
  </header>

  <section class="metrics">
    <div class="metric">
      <div class="metric-label">当前模式</div>
      <div class="difficulty-wrap">
        <select id="difficultySelect" class="difficulty-select" aria-label="AI 难度">
          <option value="rookie">菜鸟</option>
          <option value="beginner" selected>新手</option>
          <option value="expert">专家</option>
          <option value="master">大师</option>
        </select>
      </div>
      <div class="metric-sub">标准对局 · 15×15</div>
    </div>

    <div class="metric">
      <div class="metric-label">AI 思考时间</div>
      <div class="metric-value" id="timeMetric">—</div>
      <div class="metric-sub">last move</div>
    </div>

    <div class="metric">
      <div class="metric-label">搜索次数</div>
      <div class="metric-value" id="simsMetric">—</div>
      <div class="metric-sub">search</div>
    </div>

    <div class="metric">
      <div class="metric-label">局面评估</div>
      <div class="metric-value" id="valueMetric">—</div>
      <div class="metric-sub">AI value</div>
    </div>
  </section>

  <section class="board-shell">
    <div class="board-inner">
      <canvas id="board"></canvas>
    </div>
  </section>

  <div id="status" class="status-line loading">正在加载 AI...</div>

  <div class="actions">
    <button id="undoBtn">↶ 悔棋</button>
    <button id="reloadBtn">◉ 重新加载 AI</button>
    <button id="restartBtn">↻ 重新开始</button>
  </div>

  <div class="footnote">
    UINT8 · WASM · 147 KB · 大师模式 Adaptive MCTS 50/100/150
  </div>

</div>

<script>
"use strict";

const SIZE = 15;
const EMPTY = 0;
const HUMAN = 1;
const AI = 2;

const AI_WORKER_URL = "./ai-worker.js?v=tech-ui-20260911-1";

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");

const timeMetricEl = document.getElementById("timeMetric");
const simsMetricEl = document.getElementById("simsMetric");
const valueMetricEl = document.getElementById("valueMetric");
const difficultySelect = document.getElementById("difficultySelect");

const undoBtn = document.getElementById("undoBtn");
const reloadBtn = document.getElementById("reloadBtn");
const restartBtn = document.getElementById("restartBtn");

let board = [];
let history = [];

let currentPlayer = HUMAN;
let gameOver = false;
let aiThinking = false;
let lastMove = null;

let aiWorker = null;
let aiReady = false;
let lastAIValue = null;
let pendingSearchId = 0;

const DIFFICULTY_NAMES = {
  rookie: "菜鸟",
  beginner: "新手",
  expert: "专家",
  master: "大师"
};

let difficulty =
  localStorage.getItem("gomokuDifficulty") || "beginner";

if (!DIFFICULTY_NAMES[difficulty]) {
  difficulty = "beginner";
}

difficultySelect.value = difficulty;

function setStatus(text, cls = "") {
  statusEl.textContent = text;
  statusEl.className = "status-line";
  if (cls) statusEl.classList.add(cls);
}

function updateHero() {}

function updateStatus() {
  updateHero();

  if (gameOver) return;

  if (!aiReady) {
    setStatus("正在加载 AI 模型...", "loading");
    return;
  }

  if (aiThinking) {
    setStatus("AI 思考中...", "ai");
    return;
  }

  if (currentPlayer === HUMAN) {
    setStatus("轮到你：黑棋 ●");
  } else {
    setStatus("轮到 AI：白棋 ○", "ai");
  }
}

function updateButtons() {
  undoBtn.disabled = aiThinking || history.length === 0;
  reloadBtn.disabled = aiThinking;
  restartBtn.disabled = aiThinking;
}

function resetMetrics() {
  timeMetricEl.textContent = "—";
  simsMetricEl.textContent = "—";
  valueMetricEl.textContent = "—";
}

function updateMetrics(data) {
  const ms = Number(data.elapsedMs);
  const sims = Number(data.simulations);

  timeMetricEl.textContent =
    Number.isFinite(ms)
      ? (ms < 1000 ? ms.toFixed(0) + " ms" : (ms / 1000).toFixed(2) + " s")
      : "—";

  simsMetricEl.textContent =
    Number.isFinite(sims)
      ? String(sims)
      : "—";

  valueMetricEl.textContent =
    Number.isFinite(data.rootValue)
      ? Number(data.rootValue).toFixed(3)
      : "—";
}

function initGame() {
  board = Array.from(
    { length: SIZE },
    () => Array(SIZE).fill(EMPTY)
  );

  history = [];
  currentPlayer = HUMAN;
  gameOver = false;
  aiThinking = false;
  lastMove = null;
  lastAIValue = null;
  pendingSearchId++;

  resetMetrics();
  resizeCanvas();
  updateStatus();
  updateButtons();
}

function destroyAIWorker() {
  if (aiWorker) {
    aiWorker.terminate();
    aiWorker = null;
  }
  aiReady = false;
}

function loadAIWorker() {
  destroyAIWorker();

  setStatus("正在加载 147 KB UINT8 AI...", "loading");
  updateHero();

  const worker = new Worker(AI_WORKER_URL);
  aiWorker = worker;

  worker.onmessage = handleWorkerMessage;

  worker.onerror = (event) => {
    console.error("AI worker error:", event);
    if (worker !== aiWorker) return;

    aiReady = false;
    aiThinking = false;
    setStatus("AI Worker 加载失败", "error");
    updateButtons();
  };

  worker.postMessage({ type: "init" });
}

function initApp() {
  initGame();
  loadAIWorker();
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const cssSize = rect.width;
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(cssSize * dpr);
  canvas.height = Math.round(cssSize * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBoard();
}

function getBoardGeometry() {
  const w = canvas.clientWidth;
  const margin = w * 0.058;
  const gap = (w - 2 * margin) / (SIZE - 1);
  return { w, margin, gap };
}

function drawBoard() {
  const { w, margin, gap } = getBoardGeometry();

  ctx.clearRect(0, 0, w, w);

  const wood = ctx.createLinearGradient(0, 0, w, w);
  wood.addColorStop(0, "#e2b76f");
  wood.addColorStop(.48, "#c8914c");
  wood.addColorStop(1, "#d9a65f");

  ctx.fillStyle = wood;
  ctx.fillRect(0, 0, w, w);

  ctx.save();
  ctx.globalAlpha = .07;
  ctx.strokeStyle = "#6f3f16";
  ctx.lineWidth = 1;

  for (let k = 0; k < 24; k++) {
    const y = (k + .5) * w / 24;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(w*.25, y-3, w*.65, y+4, w, y-1);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = "rgba(36,28,20,.82)";
  ctx.lineWidth = 1;

  for (let i = 0; i < SIZE; i++) {
    const p = margin + i * gap;

    ctx.beginPath();
    ctx.moveTo(margin, p);
    ctx.lineTo(w - margin, p);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p, margin);
    ctx.lineTo(p, w - margin);
    ctx.stroke();
  }

  const stars = [
    [3,3], [11,3], [7,7], [3,11], [11,11]
  ];

  ctx.fillStyle = "#201813";

  for (const [x, y] of stars) {
    ctx.beginPath();
    ctx.arc(
      margin + x * gap,
      margin + y * gap,
      Math.max(2.4, gap * 0.075),
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (board[y][x] !== EMPTY) {
        drawStone(x, y, board[y][x], margin, gap);
      }
    }
  }

  if (lastMove) {
    const cx = margin + lastMove.x * gap;
    const cy = margin + lastMove.y * gap;
    const r = gap * 0.51;

    ctx.save();
    ctx.strokeStyle = "#4dd8ff";
    ctx.lineWidth = Math.max(1.5, gap * 0.055);
    ctx.shadowColor = "#31bfff";
    ctx.shadowBlur = Math.max(8, gap * 0.42);

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }
}

function drawStone(x, y, color, margin, gap) {
  const cx = margin + x * gap;
  const cy = margin + y * gap;
  const r = gap * 0.42;

  const gradient = ctx.createRadialGradient(
    cx - r * .34,
    cy - r * .36,
    r * .08,
    cx, cy, r
  );

  if (color === HUMAN) {
    gradient.addColorStop(0, "#7e8792");
    gradient.addColorStop(.23, "#343941");
    gradient.addColorStop(.68, "#111418");
    gradient.addColorStop(1, "#020304");
  } else {
    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(.52, "#f0f3f6");
    gradient.addColorStop(1, "#adb5be");
  }

  ctx.save();
  ctx.shadowColor =
    color === HUMAN
      ? "rgba(0,0,0,.48)"
      : "rgba(0,0,0,.24)";
  ctx.shadowBlur = gap * .16;
  ctx.shadowOffsetY = gap * .08;

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle =
    color === HUMAN
      ? "rgba(0,0,0,.82)"
      : "rgba(82,88,94,.65)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function placeMove(x, y, color, source) {
  if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) {
    return false;
  }

  if (board[y][x] !== EMPTY) {
    return false;
  }

  board[y][x] = color;
  history.push({ x, y, color, source });
  lastMove = { x, y };

  drawBoard();
  updateButtons();
  return true;
}

function handleBoardPointer(e) {
  if (!aiReady) {
    setStatus("AI 模型尚未加载完成", "loading");
    return;
  }

  if (
    gameOver ||
    aiThinking ||
    currentPlayer !== HUMAN
  ) {
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const { margin, gap } = getBoardGeometry();

  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  const x = Math.round((px - margin) / gap);
  const y = Math.round((py - margin) / gap);

  if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) {
    return;
  }

  if (board[y][x] !== EMPTY) {
    return;
  }

  placeMove(x, y, HUMAN, "human");

  if (checkWin(x, y, HUMAN)) {
    gameOver = true;
    setStatus("你获胜了！", "win");
    updateHero();
    updateButtons();
    return;
  }

  if (isBoardFull()) {
    gameOver = true;
    setStatus("平局。", "win");
    updateHero();
    updateButtons();
    return;
  }

  currentPlayer = AI;
  updateStatus();

  setTimeout(normalAIMove, 45);
}

function boardToFlat() {
  const flat = new Int8Array(SIZE * SIZE);

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      flat[y * SIZE + x] = board[y][x];
    }
  }

  return flat;
}

function normalAIMove() {
  if (
    !aiReady ||
    !aiWorker ||
    gameOver ||
    currentPlayer !== AI
  ) {
    return;
  }

  aiThinking = true;
  updateStatus();
  updateButtons();

  const searchId = ++pendingSearchId;
  const flat = boardToFlat();

  aiWorker.postMessage({
    type: "search",
    searchId,
    board: flat,
    difficulty
  }, [flat.buffer]);
}

function handleWorkerMessage(event) {
  const data = event.data || {};

  if (data.type === "ready") {
    aiReady = true;

    updateStatus();
    updateButtons();
    return;
  }

  if (data.type === "progress") {
    if (!aiThinking || data.searchId !== pendingSearchId) {
      return;
    }

    simsMetricEl.textContent = String(data.simulations);

    setStatus(
      "AI 思考中 · 已搜索 " + data.simulations + " 次",
      "ai"
    );
    return;
  }

  if (data.type === "result") {
    if (!aiThinking || data.searchId !== pendingSearchId) {
      return;
    }

    const x = data.x | 0;
    const y = data.y | 0;

    lastAIValue =
      Number.isFinite(data.rootValue)
        ? data.rootValue
        : null;

    updateMetrics(data);

    if (!placeMove(x, y, AI, data.source || "adaptive-mcts")) {
      aiThinking = false;
      currentPlayer = HUMAN;
      setStatus("AI 返回了非法落子", "error");
      updateHero();
      updateButtons();
      return;
    }

    if (checkWin(x, y, AI)) {
      gameOver = true;
      aiThinking = false;

      setStatus(
        "AI 获胜 · " +
        data.simulations +
        " sims · " +
        data.elapsedMs.toFixed(0) +
        " ms",
        "win"
      );

      updateButtons();
      return;
    }

    if (isBoardFull()) {
      gameOver = true;
      aiThinking = false;
      setStatus("平局。", "win");
      updateHero();
      updateButtons();
      return;
    }

    currentPlayer = HUMAN;
    aiThinking = false;

    updateStatus();
    updateButtons();
    return;
  }

  if (data.type === "error") {
    if (
      data.searchId !== undefined &&
      data.searchId !== pendingSearchId
    ) {
      return;
    }

    console.error("AI worker reported error:", data);

    aiThinking = false;
    aiReady = false;

    setStatus("AI 推理失败", "error");

    updateButtons();
  }
}

function checkWin(x, y, player) {
  const dirs = [
    [1,0],
    [0,1],
    [1,1],
    [1,-1]
  ];

  for (const [dx, dy] of dirs) {
    let count = 1;

    for (let step = 1; step < 5; step++) {
      const nx = x + dx * step;
      const ny = y + dy * step;

      if (
        nx >= 0 && nx < SIZE &&
        ny >= 0 && ny < SIZE &&
        board[ny][nx] === player
      ) {
        count++;
      } else {
        break;
      }
    }

    for (let step = 1; step < 5; step++) {
      const nx = x - dx * step;
      const ny = y - dy * step;

      if (
        nx >= 0 && nx < SIZE &&
        ny >= 0 && ny < SIZE &&
        board[ny][nx] === player
      ) {
        count++;
      } else {
        break;
      }
    }

    if (count >= 5) {
      return true;
    }
  }

  return false;
}

function isBoardFull() {
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (board[y][x] === EMPTY) {
        return false;
      }
    }
  }
  return true;
}

function undoHumanAIPair() {
  if (aiThinking || history.length === 0) {
    return;
  }

  gameOver = false;
  pendingSearchId++;

  if (
    history.length > 0 &&
    history[history.length - 1].color === AI
  ) {
    const m = history.pop();
    board[m.y][m.x] = EMPTY;
  }

  if (
    history.length > 0 &&
    history[history.length - 1].color === HUMAN
  ) {
    const m = history.pop();
    board[m.y][m.x] = EMPTY;
  }

  if (history.length > 0) {
    const m = history[history.length - 1];
    lastMove = { x: m.x, y: m.y };
  } else {
    lastMove = null;
  }

  currentPlayer = HUMAN;
  lastAIValue = null;
  resetMetrics();

  drawBoard();
  updateStatus();
  updateButtons();
}

canvas.addEventListener("pointerdown", handleBoardPointer);
window.addEventListener("resize", resizeCanvas);

undoBtn.addEventListener("click", undoHumanAIPair);

reloadBtn.addEventListener("click", () => {
  pendingSearchId++;
  aiThinking = false;
  loadAIWorker();
  updateButtons();
});

restartBtn.addEventListener("click", () => {
  initGame();
});

difficultySelect.addEventListener("change", () => {
  const selected = difficultySelect.value;

  if (!DIFFICULTY_NAMES[selected]) {
    return;
  }

  difficulty = selected;
  localStorage.setItem("gomokuDifficulty", difficulty);

  // 切换难度后开启新棋局，避免同一局中途改变 AI 强度。
  initGame();

  setStatus(
    "已切换为 " + DIFFICULTY_NAMES[difficulty] + " 难度"
  );

  setTimeout(updateStatus, 650);
});

initApp();
</script>
